name: Profile Summary

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  profile-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update profile summary
        run: |
          echo "Profile last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > profile-update.txt

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "Update profile metadata"
            git push
          fi
