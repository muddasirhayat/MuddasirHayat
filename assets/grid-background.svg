<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" class="w-full">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#2563EB" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #0F172A; stop-opacity: 1"/>
      <stop offset="100%" style="stop-color: #111827; stop-opacity: 1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <!-- Subtle accent gradients -->
  <circle cx="200" cy="150" r="150" fill="#2563EB" opacity="0.05" filter="blur(40px)"/>
  <circle cx="1000" cy="450" r="200" fill="#8B5CF6" opacity="0.04" filter="blur(50px)"/>
</svg>
