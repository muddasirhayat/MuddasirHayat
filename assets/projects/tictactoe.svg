<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #FFFFFF"/>
      <stop offset="100%" style="stop-color: #38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="#111827" rx="16"/>

  <!-- Tic tac toe grid -->
  <g transform="translate(150, 110)">
    <!-- Grid -->
    <line x1="-30" y1="-30" x2="-30" y2="30" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-30" x2="30" y2="30" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>
    
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="url(#gameGrad)" stroke-width="2" opacity="0.5"/>

    <!-- Sample game -->
    <text x="-20" y="-18" font-family="system-ui" font-size="20" fill="url(#gameGrad)" font-weight="bold">X</text>
    <text x="10" y="-18" font-family="system-ui" font-size="20" fill="url(#gameGrad)" opacity="0.6">O</text>
    <text x="-20" y="12" font-family="system-ui" font-size="20" fill="url(#gameGrad)" opacity="0.4">O</text>
  </g>

  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="600" fill="#FFFFFF">
    Tic Tac Toe AI
  </text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94A3B8">
    Game with Minimax
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748B" opacity="0.7">
    JavaScript • Algorithm
  </text>
</svg>
