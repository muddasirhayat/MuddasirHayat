<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #2563EB"/>
      <stop offset="100%" style="stop-color: #38BDF8"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .pulsing { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="300" height="300" fill="#111827" rx="16"/>

  <!-- AI wave pattern -->
  <g opacity="0.15" fill="url(#capGrad)">
    <path d="M 50,150 Q 75,100 100,150 T 150,150 T 200,150 T 250,150" stroke="url(#capGrad)" stroke-width="2" fill="none"/>
  </g>

  <!-- Icon - speech bubble with AI -->
  <g transform="translate(150, 100)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="none" stroke="url(#capGrad)" stroke-width="2"/>
    <path d="M -20,-30 L -30,-50 L -10,-30" fill="url(#capGrad)"/>
    
    <!-- Dot indicators -->
    <circle cx="-15" cy="-5" r="3" fill="url(#capGrad)" class="pulsing"/>
    <circle cx="0" cy="-5" r="3" fill="url(#capGrad)" class="pulsing" style="animation-delay: 0.2s"/>
    <circle cx="15" cy="-5" r="3" fill="url(#capGrad)" class="pulsing" style="animation-delay: 0.4s"/>
  </g>

  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="600" fill="#FFFFFF">
    Capverse
  </text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94A3B8">
    AI Caption Generation
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748B" opacity="0.7">
    Open Source
  </text>
</svg>
