<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="currGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #38BDF8"/>
      <stop offset="100%" style="stop-color: #8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="#111827" rx="16"/>

  <!-- Currency icon -->
  <g transform="translate(150, 110)">
    <!-- Coins -->
    <circle cx="-20" cy="-5" r="15" fill="none" stroke="url(#currGrad)" stroke-width="2"/>
    <text x="-20" y="2" text-anchor="middle" font-family="system-ui" font-size="16" fill="url(#currGrad)">$</text>
    
    <circle cx="0" cy="15" r="15" fill="none" stroke="url(#currGrad)" stroke-width="2" opacity="0.6"/>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui" font-size="16" fill="url(#currGrad)" opacity="0.6">€</text>
    
    <circle cx="20" cy="-5" r="15" fill="none" stroke="url(#currGrad)" stroke-width="2" opacity="0.4"/>
    <text x="20" y="2" text-anchor="middle" font-family="system-ui" font-size="16" fill="url(#currGrad)" opacity="0.4">¥</text>
  </g>

  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="600" fill="#FFFFFF">
    Currency Converter
  </text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94A3B8">
    Real-time Exchange Rates
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748B" opacity="0.7">
    JavaScript • API Integration
  </text>
</svg>
