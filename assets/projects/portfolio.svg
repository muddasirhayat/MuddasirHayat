<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #8B5CF6"/>
      <stop offset="100%" style="stop-color: #2563EB"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="#111827" rx="16"/>

  <!-- Portfolio grid icon -->
  <g transform="translate(150, 110)">
    <rect x="-35" y="-35" width="20" height="20" rx="4" fill="none" stroke="url(#portGrad)" stroke-width="2"/>
    <rect x="15" y="-35" width="20" height="20" rx="4" fill="url(#portGrad)" opacity="0.3"/>
    <rect x="-35" y="15" width="20" height="20" rx="4" fill="url(#portGrad)" opacity="0.5"/>
    <rect x="15" y="15" width="20" height="20" rx="4" fill="url(#portGrad)" opacity="0.7"/>
  </g>

  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="600" fill="#FFFFFF">
    Portfolio
  </text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui" font-size="12" fill="#94A3B8">
    Personal Showcase
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="system-ui" font-size="11" fill="#64748B" opacity="0.7">
    Next.js • React • TailwindCSS
  </text>
</svg>
