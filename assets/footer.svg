<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" class="w-full">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #2563EB; stop-opacity: 0.2"/>
      <stop offset="100%" style="stop-color: #8B5CF6; stop-opacity: 0.1"/>
    </linearGradient>
    <style>
      @keyframes slideUp {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .footer-item { animation: slideUp 0.8s ease-out forwards; }
      .footer-text { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="#0F172A"/>

  <!-- Gradient overlay -->
  <rect width="1200" height="200" fill="url(#footerGrad)"/>

  <!-- Top border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#2563EB" stroke-width="1" opacity="0.3"/>

  <!-- Content sections -->
  <g class="footer-item" style="animation-delay: 0s;">
    <text x="150" y="50" class="footer-text" font-size="16" font-weight="600" fill="#38BDF8">Connect</text>
    <text x="150" y="80" class="footer-text" font-size="14" fill="#CBD5E1" opacity="0.8">Email: mhsons2025@gmail.com</text>
    <text x="150" y="105" class="footer-text" font-size="14" fill="#CBD5E1" opacity="0.8">GitHub: muddasirhayat</text>
  </g>

  <g class="footer-item" style="animation-delay: 0.1s;">
    <text x="550" y="50" class="footer-text" font-size="16" font-weight="600" fill="#38BDF8">Based In</text>
    <text x="550" y="80" class="footer-text" font-size="14" fill="#CBD5E1" opacity="0.8">Pakistan</text>
  </g>

  <g class="footer-item" style="animation-delay: 0.2s;">
    <text x="900" y="50" class="footer-text" font-size="16" font-weight="600" fill="#38BDF8">Interests</text>
    <text x="900" y="80" class="footer-text" font-size="14" fill="#CBD5E1" opacity="0.8">AI • Open Source • Web</text>
    <text x="900" y="105" class="footer-text" font-size="14" fill="#CBD5E1" opacity="0.8">Development Tools</text>
  </g>

  <!-- Bottom section -->
  <text x="600" y="160" text-anchor="middle" class="footer-text" font-size="13" fill="#64748B" opacity="0.7">
    © 2026 • Building the future, one line of code at a time
  </text>
</svg>
