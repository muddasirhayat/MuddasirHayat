<svg viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg" class="w-full">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color: #2563EB; stop-opacity: 0"/>
      <stop offset="50%" style="stop-color: #38BDF8; stop-opacity: 0.5"/>
      <stop offset="100%" style="stop-color: #2563EB; stop-opacity: 0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="80" fill="#0F172A" opacity="0"/>
  
  <!-- Wavy divider line -->
  <path d="M 0,40 Q 300,20 600,40 T 1200,40" stroke="url(#dividerGrad)" stroke-width="2" fill="none"/>
  
  <!-- Subtle dots -->
  <g opacity="0.3">
    <circle cx="200" cy="40" r="3" fill="#38BDF8"/>
    <circle cx="400" cy="40" r="2" fill="#2563EB"/>
    <circle cx="600" cy="40" r="3" fill="#38BDF8"/>
    <circle cx="800" cy="40" r="2" fill="#2563EB"/>
    <circle cx="1000" cy="40" r="3" fill="#38BDF8"/>
  </g>
</svg>
